<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maidbook — Changelog</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="brand" href="index.html">● Maidbook</a>
    <a href="docs.html">Docs</a>
    <a href="changelog.html">Changelog</a>
    <a href="https://github.com/Learn57130/Maidbook">GitHub</a>
    <a href="https://pypi.org/project/maidbook/">PyPI</a>
  </nav>
  <article id="content" class="md"><p class="dim">Loading changelog…</p></article>
</div>
<script src="marked.min.js"></script>
<script>
  const RAW = "https://raw.githubusercontent.com/Learn57130/Maidbook/main/CHANGELOG.md";
  const GH  = "https://github.com/Learn57130/Maidbook/blob/main/CHANGELOG.md";
  const el = document.getElementById("content");
  fetch(RAW)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(md => { el.innerHTML = marked.parse(md); })
    .catch(err => {
      el.innerHTML = '<p class="err">Couldn\'t load the changelog (' + err +
        '). <a href="' + GH + '">View on GitHub →</a></p>';
    });
</script>
</body>
</html>
